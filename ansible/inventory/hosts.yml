# inventory/hosts.yml - THE single source of truth for the infrastructure.
#
# Ansible reads this to know which machines exist and how to reach them.
# The Vagrantfile reads this SAME file to know which VMs to create, so an IP
# or hostname is only ever written in one place.
#
#   ansible_host  -> the VM's static private IP
#   vm_memory     -> RAM in MB   (used by Vagrant only)
#   vm_cpus       -> CPU cores   (used by Vagrant only)
#   bonus: true   -> only created when ENABLE_BONUS=true
#
# Vagrant always creates cicd-server LAST: it is the Ansible control node
# and configures every other VM.

all:
  children:
    # core: the 6 VMs the project requires (always created)
    core:
      children:
        loadbalancers:
          hosts:
            load-balancer:
              ansible_host: 192.168.56.10
              vm_memory: 512
              vm_cpus: 1
        webservers:
          hosts:
            web-server-1:
              ansible_host: 192.168.56.11
              vm_memory: 640
              vm_cpus: 1
            web-server-2:
              ansible_host: 192.168.56.12
              vm_memory: 640
              vm_cpus: 1

        appservers:
          hosts:
            app-server:
              ansible_host: 192.168.56.13
              vm_memory: 768
              vm_cpus: 1

        cicd:
          hosts:
            cicd-server:
              ansible_host: 192.168.56.14
              # Ansible runs ON this VM, so it configures itself directly
              # instead of SSH-ing into itself.
              ansible_connection: local
              vm_memory: 2048
              vm_cpus: 1
        # Project 4: Prometheus, Grafana and the ELK stack, on their own VM so
        # monitoring keeps working even when an app VM is overloaded or down.
        monitoring:
          hosts:
            monitoring-server:
              ansible_host: 192.168.56.16  # .15 is the bonus backup server
              vm_memory: 4608  # 2 Elasticsearch nodes + Logstash + Kibana + Prometheus + Grafana
              vm_cpus: 2

    # docker_hosts: every VM that runs containers. Not new VMs - just a second
    # name for existing groups, so "install Docker" and "install cAdvisor"
    # target the same list. Written once, used by site.yml and monitoring-agents.yml.
    docker_hosts:
      children:
        webservers:
        appservers:
        cicd:
        monitoring:
    # --- Bonus: only with ENABLE_BONUS=true ---------------------------------
    backups:
      hosts:
        backup-server:
          ansible_host: 192.168.56.15
          vm_memory: 512
          vm_cpus: 1  # 2 vCPUs hung at boot (VirtualBox + Hyper-V/WSL)
          bonus: true
