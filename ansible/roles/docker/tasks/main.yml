# roles/docker - Docker Engine from Docker's official apt repository.

- name: Create the apt keyrings folder
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's signing key (proves packages really come from Docker)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    # umask 0027 would make it root-only; 0644 lets any user run apt read-only.
    mode: "0644"
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    lock_timeout: 600

# log-opts: without them, container logs grow forever and can fill the disk.
# containerd-snapshotter false: Docker 29 stores images in containerd by default,
# and cAdvisor v0.49.1 can't read that store (no container names in its metrics).
# This keeps Docker on the classic overlay2 store that cAdvisor understands.
- name: Configure Docker (log size limit, classic image store)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "features": { "containerd-snapshotter": false }
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Restart Docker now, not at the end of the play, so the containers and images
# created later in this run go into the new image store.
- name: Apply Docker config changes now
  ansible.builtin.meta: flush_handlers

- name: Start Docker now and on every boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
