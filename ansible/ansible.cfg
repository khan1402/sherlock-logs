# ansible.cfg - default settings, so commands stay short.
# With this file, `ansible-playbook site.yml` needs no extra flags.

[defaults]
inventory              = inventory/hosts.yml
roles_path             = roles
remote_user            = devops
private_key_file       = ~/.ssh/ansible_key
interpreter_python     = auto_silent
# Readable task output instead of raw JSON
stdout_callback        = default
callback_result_format = yaml
# Show how long each task takes (handy for the review)
callbacks_enabled      = ansible.posix.profile_tasks
retry_files_enabled    = False
# All 7 VMs in one batch (default is 5): faster runs, and no VM sits idle
# between its tasks long enough for its SSH connection to expire (see below).
forks                  = 10
# Decrypts vault.yml automatically (file copied here by bootstrap.sh, never committed)
vault_password_file    = ~/.vault_pass

[privilege_escalation]
become = True

[ssh_connection]
# accept-new: trust a VM's host key the first time, but refuse if it ever
# changes (safer than turning host key checking off completely).
# ControlPersist=30m: reuse one SSH connection per VM for 30 minutes. With 60s,
# a VM idle for a minute (slow task on the others) had its connection close
# exactly while Ansible started the next task -> "MODULE FAILURE rc: -13".
ssh_args   = -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=accept-new
pipelining = True
