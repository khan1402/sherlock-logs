# Default values for the monitoring role (runs on monitoring-server only).

# Everything for the stack lives here: docker-compose.yml + config files.
monitoring_dir: /opt/monitoring

# --- Pinned image versions (upgrade = change the number, re-run Ansible) -------
monitoring_prometheus_image: prom/prometheus:v3.5.0  # 3.5 = long-term support release
monitoring_grafana_image: grafana/grafana:12.1.0

# --- Ports (must match group_vars/monitoring/firewall.yml) ---------------------
monitoring_prometheus_port: 9090
monitoring_grafana_port: 3000

# --- Prometheus -------------------------------------------------------------------
# How often Prometheus pulls metrics from every target. 15 s is the common
# default: fresh enough for 5-minute alerts, light enough for small VMs.
monitoring_scrape_interval: 15s
# How often alert/recording rules are evaluated.
monitoring_evaluation_interval: 15s
# Long-term retention: data is deleted when EITHER limit is reached first.
monitoring_retention_time: 15d
monitoring_retention_size: 5GB

# --- Grafana --------------------------------------------------------------------
monitoring_grafana_admin_user: admin
# Real value lives in the encrypted vault.yml.
monitoring_grafana_admin_password: "{{ vault_grafana_admin_password }}"
# One version for Elasticsearch, Logstash, Kibana AND Filebeat: Elastic only
# supports matching versions. 8.19 = the last 8.x line, supported long-term.
monitoring_elastic_version: "8.19.2"
monitoring_elasticsearch_image: "docker.elastic.co/elasticsearch/elasticsearch:{{ monitoring_elastic_version }}"
monitoring_logstash_image: "docker.elastic.co/logstash/logstash:{{ monitoring_elastic_version }}"
monitoring_kibana_image: "docker.elastic.co/kibana/kibana:{{ monitoring_elastic_version }}"

monitoring_kibana_port: 5601
monitoring_logstash_beats_port: 5044  # Filebeat -> Logstash (firewall rule: project VMs only)

# Elasticsearch is NOT reachable from the network: each node is published on
# the VM's loopback only (127.0.0.1), for Logstash, Kibana and the exporter.
monitoring_es01_port: 9200
monitoring_es02_port: 9201

# Java heap per service. Elasticsearch: heap = half of the container limit
# (the other half is used by the OS file cache, which makes searches fast).
monitoring_es_heap: 1g
monitoring_es_mem_limit: 2g
monitoring_logstash_heap: 512m
monitoring_logstash_mem_limit: 1g
monitoring_kibana_mem_limit: 1g

# Log retention: an ILM policy deletes log indices older than this.
monitoring_logs_retention_days: 14

# App containers whose stdout is JSON from logging_setup.py -> 'app' index.
monitoring_app_containers: [backend, frontend]
