# roles/node_exporter - host metrics (CPU, memory, disk, network) for Prometheus.
#
# Runs as a normal systemd service, NOT in Docker: it must see the real host
# (all disks, all network interfaces), and it also has to work on VMs that
# have no Docker at all (the load balancer).

- name: Create the node_exporter system user (no login, no home)
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# BOTH folders listed on purpose: Ansible would create the parent folder
# automatically, but with the hardened umask 027 (mode 0750), and the
# node_exporter user could then not reach its own binary (Project 1 lesson).
- name: Create the install folders (readable by the service user)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/node_exporter
    - "{{ node_exporter_install_dir }}"

# The checksum comes from the official sha256sums.txt of the same release.
# A corrupted or tampered download fails here instead of being installed.
# If the file already exists with the right checksum, nothing is downloaded.
- name: Download Node Exporter, checksum verified - {{ node_exporter_version }}
  ansible.builtin.get_url:
    url: "{{ node_exporter_release_url }}/{{ node_exporter_tarball }}"
    dest: "/opt/node_exporter/{{ node_exporter_tarball }}"
    checksum: "sha256:{{ node_exporter_release_url }}/sha256sums.txt"
    owner: root
    group: root
    mode: "0644"

- name: Unpack Node Exporter
  ansible.builtin.unarchive:
    src: "/opt/node_exporter/{{ node_exporter_tarball }}"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]  # drop the top folder from the archive
    creates: "{{ node_exporter_install_dir }}/node_exporter"

- name: Point /usr/local/bin/node_exporter to this version
  ansible.builtin.file:
    src: "{{ node_exporter_install_dir }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link
  notify: Restart node_exporter

- name: Install the systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Start Node Exporter now and on every boot
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

# Apply a pending restart NOW, so the check below tests the new version/config.
- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait until Node Exporter answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
    status_code: 200
    return_content: false
  register: node_exporter_check
  until: node_exporter_check.status == 200
  retries: 10
  delay: 2
